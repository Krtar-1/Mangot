<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Book - Mangot</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">Mangot</a>
            <div class="nav-links">
                <a href="search.html" class="nav-link">Search</a>
                <a href="users.html" class="nav-link">Collectors</a>
                <a href="collection.html" class="nav-link">My Collection</a>
                <a href="profile.html" class="nav-profile-link" title="Profile">
                    <div class="nav-avatar" id="nav-avatar">
                        <img id="nav-avatar-img" src="" alt="Profile" style="display: none;">
                        <span id="nav-avatar-initial">?</span>
                    </div>
                </a>
            </div>
        </nav>
    </header>

    <main>
        <section class="form-container">
            <h1>Register a Book</h1>
            <p class="form-description">Add a new book to your collection</p>

            <button type="button" id="import-book-btn" class="import-book-btn">
                <span class="import-icon">&#128269;</span>
                Import Book
            </button>

            <form id="book-form" class="book-form">
                <div class="form-group photo-upload">
                    <label for="book-photo">Book Photo</label>
                    <div class="photo-preview" id="photo-preview">
                        <span class="photo-placeholder">Click to upload photo</span>
                        <img id="preview-image" src="" alt="Book preview">
                    </div>
                    <input type="file" id="book-photo" name="photo" accept="image/*">
                </div>

                <div class="form-group">
                    <label for="book-title">Title <span class="required">*</span></label>
                    <input type="text" id="book-title" name="title" required placeholder="Enter book title">
                </div>

                <div class="form-group">
                    <label for="book-author">Author <span class="required">*</span></label>
                    <input type="text" id="book-author" name="author" required placeholder="Enter author name">
                </div>

                <div class="form-group">
                    <label for="book-date">Date Acquired <span class="optional">(optional)</span></label>
                    <input type="date" id="book-date" name="dateAcquired">
                </div>

                <div class="form-group">
                    <label>Genre <span class="required">*</span> <span class="genre-hint">(select up to 3)</span></label>
                    <div class="genre-checkboxes" id="genre-checkboxes">
                        <label class="genre-checkbox"><input type="checkbox" name="genre" value="Myth"><span>Myth</span></label>
                        <label class="genre-checkbox"><input type="checkbox" name="genre" value="Romance"><span>Romance</span></label>
                        <label class="genre-checkbox"><input type="checkbox" name="genre" value="Novel"><span>Novel</span></label>
                        <label class="genre-checkbox"><input type="checkbox" name="genre" value="Fiction"><span>Fiction</span></label>
                        <label class="genre-checkbox"><input type="checkbox" name="genre" value="Biography"><span>Biography</span></label>
                        <label class="genre-checkbox"><input type="checkbox" name="genre" value="Fairy Tale"><span>Fairy Tale</span></label>
                        <label class="genre-checkbox"><input type="checkbox" name="genre" value="Drama"><span>Drama</span></label>
                        <label class="genre-checkbox"><input type="checkbox" name="genre" value="History"><span>History</span></label>
                        <label class="genre-checkbox"><input type="checkbox" name="genre" value="Western"><span>Western</span></label>
                        <label class="genre-checkbox"><input type="checkbox" name="genre" value="Poems"><span>Poems</span></label>
                        <label class="genre-checkbox"><input type="checkbox" name="genre" value="Non-Fiction"><span>Non-Fiction</span></label>
                        <label class="genre-checkbox"><input type="checkbox" name="genre" value="Manga"><span>Manga</span></label>
                        <label class="genre-checkbox"><input type="checkbox" name="genre" value="Horror"><span>Horror</span></label>
                        <label class="genre-checkbox"><input type="checkbox" name="genre" value="Children"><span>Children</span></label>
                        <label class="genre-checkbox"><input type="checkbox" name="genre" value="Dark"><span>Dark</span></label>
                        <label class="genre-checkbox"><input type="checkbox" name="genre" value="Fantasy"><span>Fantasy</span></label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="book-series">Series <span class="optional">(optional)</span></label>
                    <input type="text" id="book-series" name="series" placeholder="Enter series name if applicable">
                </div>

                <div class="form-group">
                    <label>Read Status</label>
                    <label class="read-toggle">
                        <input type="checkbox" id="book-read" name="read">
                        <span class="read-toggle-slider"></span>
                        <span class="read-toggle-label" id="read-label">Unread</span>
                    </label>
                </div>

                <button type="submit" class="cta submit-btn">Add to Collection</button>
            </form>
        </section>
    </main>

    <!-- Import Book Modal -->
    <div id="import-modal" class="modal">
        <div class="modal-content import-modal-content">
            <div class="modal-header">
                <h2>Import Book</h2>
                <button class="modal-close" id="import-modal-close">&times;</button>
            </div>
            <div class="import-search-container">
                <input type="text" id="import-search-input" placeholder="Search by title or ISBN..." autocomplete="off">
                <button type="button" id="import-search-btn" class="cta">Search</button>
            </div>
            <div id="import-results" class="import-results">
                <p class="import-hint">Enter a book title or ISBN to search</p>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Mangot</p>
    </footer>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <!-- App Scripts -->
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/auth-guard.js"></script>
    <script>
        // Protect this route
        requireAuth();
    </script>
    <script src="register.js"></script>
</body>
</html>
